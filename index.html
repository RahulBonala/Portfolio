<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Favicon & Logo -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <meta name="color-scheme" content="dark light" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Apply persisted theme before first paint to avoid flash (default: dark) -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('portfolio-theme');
        var theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>

  <!-- Google Search Console Verification -->
  <meta name="google-site-verification" content="dn7zrSFJ9YeU3Xf_YiNrlGOqahY9XnfirkrEmUio5IY" />

  <meta name="theme-color" content="#060607" />

  <!-- Title & Description -->
  <title>Rahul Bonala | Product Designer &amp; AI Builder, Bengaluru</title>
  <meta name="description"
    content="Rahul Bonala is a product designer and AI builder in Bengaluru. See AI agent projects, product case studies and Zero to Live website sessions." />
  <meta name="author" content="Rahul Bonala" />
  <meta name="robots" content="index, follow, max-image-preview:large" />

  <!-- Canonical -->
  <link rel="canonical" href="https://rahulbonala.me/" />

  <!-- Open Graph -->
  <meta property="og:type" content="profile" />
  <meta property="og:title" content="Rahul Bonala | Product Designer &amp; AI Builder" />
  <meta property="og:description"
    content="Product designer and AI builder in Bengaluru. Creator of BestAnswersAI and Stepforge." />
  <meta property="og:url" content="https://rahulbonala.me/" />
  <meta property="og:image" content="https://rahulbonala.me/og-image.png" />
  <!-- The real size of public/og-image.png (it is not 1200x630). -->
  <meta property="og:image:width" content="1422" />
  <meta property="og:image:height" content="650" />
  <meta property="og:image:alt" content="Rahul Bonala, product designer and AI builder" />
  <meta property="og:site_name" content="Rahul Bonala" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Rahul Bonala | Product Designer &amp; AI Builder" />
  <meta name="twitter:description"
    content="Product designer and AI builder in Bengaluru. Creator of BestAnswersAI and Stepforge." />
  <meta name="twitter:image" content="https://rahulbonala.me/og-image.png" />
  <meta name="twitter:image:alt" content="Rahul Bonala, product designer and AI builder" />

  <!-- Structured data: the site-wide graph (Person + WebSite). Page-specific
       blocks (ProfilePage + FAQPage on the home page, Article, Service,
       CollectionPage) are added per route by scripts/prerender.js at the
       marker below, so each one only appears on the page it describes. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "@id": "https://rahulbonala.me/#person",
        "name": "Rahul Bonala",
        "alternateName": "Sri Sai Rahul Bonala",
        "url": "https://rahulbonala.me/",
        "image": "https://rahulbonala.me/og-image.png",
        "jobTitle": "Product Designer & AI Builder",
        "worksFor": { "@type": "Organization", "name": "Ginthi.ai" },
        "address": { "@type": "PostalAddress", "addressLocality": "Bengaluru", "addressRegion": "Karnataka", "addressCountry": "IN" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "SASTRA University" },
        "knowsAbout": ["Product design", "UX design", "AI agents", "Multi agent systems", "Frontend development", "React", "TypeScript"],
        "sameAs": [
          "https://www.linkedin.com/in/sri-sai-rahul-7b08b51b1/",
          "https://github.com/RahulBonala",
          "https://www.youtube.com/channel/UCIfuWTDvEMRy-5Ib68FBcMg",
          "https://bestanswersai.com/",
          "https://stepforge.co/"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://rahulbonala.me/#website",
        "url": "https://rahulbonala.me/",
        "name": "Rahul Bonala",
        "publisher": { "@id": "https://rahulbonala.me/#person" },
        "inLanguage": "en-IN"
      }
    ]
  }
  </script>
  <!-- route-jsonld -->

  <!-- Sitemap hint -->
  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

  <!-- Fonts: self-hosted (@font-face in src/fonts.css). Preload the two
       above-the-fold faces (display headline + body) so both are ready before
       first paint on every load. This is the fix for the font "jitter":
       same-origin + preload means the real font is always shown from the first
       frame (no swap to/from a fallback), and there's no layout shift (CLS 0). -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-latin.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
