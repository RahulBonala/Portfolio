<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Rahul Bonala">
  <!-- Rahul Mark System v2 — Ink field #19140f / orange-500 glyph, 6.4:1
       Constellation "R", now built from bars thick enough to fuse. It resolves
       differently by size on purpose: a node network at 512, a solid letterform
       at 16. v1 drew it with 2-unit links and it dissolved into loose dots. -->
  <rect width="512" height="512" rx="114" fill="#19140f"/>
  <svg x="84" y="84" width="344" height="344" viewBox="0 0 24 24">
    <g stroke="#ff6b1a" stroke-width="3.6" stroke-linecap="round" fill="none">
      <path d="M6.5 21V3"/>
      <path d="M6.5 3h7.5"/>
      <path d="M14 3l4.5 4.5"/>
      <path d="M18.5 7.5L14 12"/>
      <path d="M14 12H6.5"/>
      <path d="M11 12l7.5 9"/>
    </g>
    <g fill="#ff6b1a">
      <circle cx="6.5" cy="3" r="2.3"/>
      <circle cx="14" cy="3" r="2.3"/>
      <circle cx="18.5" cy="7.5" r="2.3"/>
      <circle cx="14" cy="12" r="2.3"/>
      <circle cx="6.5" cy="21" r="2.5"/>
      <circle cx="18.5" cy="21" r="2.5"/>
    </g>
    <!-- the junction where stem, bar and leg meet -->
    <circle cx="6.5" cy="12" r="1.35" fill="#fbf7f0" data-role="accent"/>
  </svg>
</svg>
